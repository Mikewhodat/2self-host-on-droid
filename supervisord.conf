[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
user=root

[program:mysqld]
command=/usr/sbin/mysqld --user=mysql --datadir=/data/mysql --socket=/var/run/mysqld/mysqld.sock --pid-file=/var/run/mysqld/mysqld.pid
autostart=true
autorestart=true
user=mysql
stdout_logfile=/var/log/mysqld.log
stderr_logfile=/var/log/mysqld-error.log
startsecs=10
startretries=5
priority=100

[program:php-fpm]
command=/usr/sbin/php-fpm8.1 --nodaemonize --fpm-config /etc/php/8.1/fpm/php-fpm.conf
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/php-fpm.log
stderr_logfile=/var/log/php-fpm-error.log
startsecs=5
startretries=5
priority=200

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx-error.log
startsecs=5
startretries=5
priority=300
depends_on=php-fpm

[program:ollama]
command=ollama serve
directory=/root
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/ollama.log
stderr_logfile=/var/log/ollama-error.log
startsecs=10
startretries=5
environment=OLLAMA_HOST=0.0.0.0:11434
priority=400

[program:flask-proxy]
command=python3 /app/ollama_proxy.py
directory=/app
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/flask-proxy.log
stderr_logfile=/var/log/flask-proxy-error.log
startsecs=5
startretries=5
priority=450
depends_on=ollama

[program:java-backend]
command=java -jar target/blog-app-1.0.jar
directory=/app/java-backend
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/java-backend.log
stderr_logfile=/var/log/java-backend-error.log
startsecs=10
startretries=5
priority=500

[program:python-api]
command=/usr/local/bin/uvicorn backend:app --host 0.0.0.0 --port 8000
directory=/app/python-backend
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/python-api.log
stderr_logfile=/var/log/python-api-error.log
startsecs=5
startretries=5
priority=600

[program:chromadb]
command=chroma run --host 0.0.0.0 --port 8123 --path /data/chroma
directory=/data/chroma
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/chromadb.log
stderr_logfile=/var/log/chromadb-error.log
startsecs=10
startretries=5
priority=700