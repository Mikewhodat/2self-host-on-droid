<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pydantic AI - Code Correction Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .main-panel {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: black; }
        .btn-danger { background: #dc3545; color: white; }

        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .code-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .code-panel {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .code-header {
            background: #f8f9fa;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            font-weight: 600;
        }

        .code-editor {
            width: 100%;
            height: 400px;
            padding: 15px;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        .output-panel {
            grid-column: 1 / -1;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .output-content {
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            min-height: 150px;
            background: #f8f9fa;
            white-space: pre-wrap;
        }

        .error-list {
            margin-bottom: 20px;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
        }

        .error-item {
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-left: 4px solid #dc3545;
            border-radius: 4px;
        }

        .hidden { display: none; }

        @media (max-width: 768px) {
            .code-section { grid-template-columns: 1fr; }
            .toolbar { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Pydantic AI</h1>
            <p>Python Code Analysis & Execution Platform</p>
        </div>

        <div class="main-panel">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="analyzeCode()">🔍 Analyze Code</button>
                <button class="btn btn-warning" onclick="correctErrors()">🔧 Fix Errors</button>
                <button class="btn btn-success" onclick="executeCode()">▶️ Execute</button>
                <button class="btn btn-danger" onclick="clearAll()">🗑️ Clear</button>
            </div>

            <div class="code-section">
                <div class="code-panel">
                    <div class="code-header">Original Code</div>
                    <textarea class="code-editor" id="inputCode" placeholder="# Enter your Python code here...
def factorial(n):
    if n = 0:  # Error: should be ==
        return 1
    return n * factorial(n-1)

print factorial(5)  # Error: missing parentheses"></textarea>
                </div>

                <div class="code-panel">
                    <div class="code-header">Corrected Code</div>
                    <textarea class="code-editor" id="correctedCode" placeholder="# Corrected code will appear here..." readonly></textarea>
                </div>
            </div>

            <div class="error-list hidden" id="errorList">
                <h3>Errors Found:</h3>
                <div id="errorItems"></div>
            </div>

            <div class="output-panel">
                <div class="code-header">Execution Output</div>
                <div class="output-content" id="outputContent">Ready to execute code...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        async function analyzeCode() {
            const code = document.getElementById('inputCode').value;
            if (!code.trim()) {
                alert('Please enter some code to analyze');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });

                if (!response.ok) throw new Error('Analysis failed');

                const result = await response.json();
                displayErrors(result.errors);
                
            } catch (error) {
                alert('Error analyzing code: ' + error.message);
            }
        }

        async function correctErrors() {
            const code = document.getElementById('inputCode').value;
            if (!code.trim()) {
                alert('Please enter some code to correct');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/correct`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });

                if (!response.ok) throw new Error('Correction failed');

                const result = await response.json();
                document.getElementById('correctedCode').value = result.corrected_code;
                
            } catch (error) {
                alert('Error correcting code: ' + error.message);
            }
        }

        async function executeCode() {
            const code = document.getElementById('correctedCode').value || document.getElementById('inputCode').value;
            if (!code.trim()) {
                alert('Please enter some code to execute');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });

                if (!response.ok) throw new Error('Execution failed');

                const result = await response.json();
                document.getElementById('outputContent').textContent = result.output || result.error;
                
            } catch (error) {
                document.getElementById('outputContent').textContent = 'Error: ' + error.message;
            }
        }

        function displayErrors(errors) {
            const errorList = document.getElementById('errorList');
            const errorItems = document.getElementById('errorItems');
            
            if (!errors || errors.length === 0) {
                errorList.classList.add('hidden');
                return;
            }

            errorItems.innerHTML = '';
            errors.forEach(error => {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-item';
                errorDiv.innerHTML = `<strong>Line ${error.line}:</strong> ${error.message}`;
                errorItems.appendChild(errorDiv);
            });

            errorList.classList.remove('hidden');
        }

        function clearAll() {
            document.getElementById('inputCode').value = '';
            document.getElementById('correctedCode').value = '';
            document.getElementById('outputContent').textContent = 'Ready to execute code...';
            document.getElementById('errorList').classList.add('hidden');
        }
    </script>
</body>
</html>
