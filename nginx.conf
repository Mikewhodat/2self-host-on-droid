user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;

    upstream python_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    upstream java_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream flask_proxy {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index homepage_with_login.html index.html;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Rate limiting for API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            # Continue with proxy logic below
        }

        # Main site
        location / {
            limit_req zone=general burst=10 nodelay;
            try_files $uri $uri/ =404;
        }

        # WordPress
        location /wordpress/ {
            root /var/www/html;
            index index.php index.html index.htm;
            try_files $uri $uri/ /wordpress/index.php?$args;
        }

        location ~ ^/wordpress/.*\.php$ {
            root /var/www/html;
            fastcgi_split_path_info ^(/wordpress/.+\.php)(/.*)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            include fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # Prevent access to PHP files in uploads
        location ~* /wordpress/(?:uploads|files)/.*\.php$ {
            deny all;
        }

        # Static pages
        location /weather {
            try_files /weather_page.html =404;
        }

        location /plant {
            try_files /plant_management.html =404;
        }

        location /system {
            try_files /system_management_page.html =404;
        }

        location /assistant {
            try_files /ai_assistant_page.html =404;
        }

        location /dashboard {
            try_files /main_dashboard.html =404;
        }

        location /blog {
            try_files $uri /blogging_website.html;
        }

        # NEW: Pydantic AI Code Editor & Linter
        location /pydantic {
            try_files /python_editor-linter.html =404;
        }

        # Alternative routes for the code editor
        location /code-editor {
            try_files /python_editor-linter.html =404;
        }

        location /python-editor {
            try_files /python_editor-linter.html =404;
        }

        location /linter {
            try_files /python_editor-linter.html =404;
        }

        # Python API backend
        location /api/python/ {
            proxy_pass http://python_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # Java backend
        location /api/java/ {
            proxy_pass http://java_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Ollama API proxy
        location /api/ollama/ {
            proxy_pass http://flask_proxy/api/ollama/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_cache off;
        }

        # ChromaDB direct access (if needed)
        location /api/chroma/ {
            proxy_pass http://127.0.0.1:8123/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static assets caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
        }

        # Security
        location ~ /\.ht {
            deny all;
        }

        location ~ /\. {
            deny all;
        }
    }
}