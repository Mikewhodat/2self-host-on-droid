<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Management - Home Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 15px; padding: 20px; margin-bottom: 30px; text-align: center; }
        .header h1 { color: white; font-size: 2.5rem; margin-bottom: 10px; }
        .nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .nav-btn { padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; transition: all 0.3s; }
        .nav-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); }
        .section { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 15px; padding: 25px; margin-bottom: 25px; }
        .section h2 { color: white; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 25px; cursor: pointer; transition: all 0.3s; }
        .tab.active { background: rgba(255,255,255,0.3); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: white; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: none; border-radius: 8px; background: rgba(255,255,255,0.9); font-size: 14px; }
        .btn { padding: 12px 25px; background: #4CAF50; color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; transition: all 0.3s; }
        .btn:hover { background: #45a049; transform: translateY(-2px); }
        .btn-secondary { background: #2196F3; }
        .btn-secondary:hover { background: #1976D2; }
        .plant-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .plant-card { background: rgba(255,255,255,0.15); border-radius: 15px; padding: 20px; border-left: 5px solid #4CAF50; }
        .plant-card h3 { color: white; margin-bottom: 10px; }
        .plant-info { color: rgba(255,255,255,0.9); line-height: 1.6; }
        .plant-info strong { color: white; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .stat-card { background: rgba(255,255,255,0.15); border-radius: 15px; padding: 20px; text-align: center; }
        .stat-number { font-size: 2.5rem; font-weight: bold; color: white; }
        .stat-label { color: rgba(255,255,255,0.8); font-size: 1.1rem; }
        .message { padding: 15px; border-radius: 8px; margin: 15px 0; }
        .message.success { background: rgba(76, 175, 80, 0.3); color: white; border: 1px solid #4CAF50; }
        .message.error { background: rgba(244, 67, 54, 0.3); color: white; border: 1px solid #f44336; }
        .search-box { width: 100%; padding: 12px; border: none; border-radius: 25px; background: rgba(255,255,255,0.9); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌱 Plant Management</h1>
            <div class="nav">
                <a href="index.html" class="nav-btn">🏠 Home</a>
                <a href="weather.html" class="nav-btn">🌤️ Weather</a>
                <a href="plants.html" class="nav-btn">🌱 Plants</a>
                <a href="ai-chat.html" class="nav-btn">🤖 AI Chat</a>
                <a href="system.html" class="nav-btn">⚙️ System</a>
            </div>
        </div>

        <div class="section">
            <div class="tabs">
                <button class="tab active" onclick="showTab('add-plant')">Add Plant</button>
                <button class="tab" onclick="showTab('view-plants')">View Plants</button>
                <button class="tab" onclick="showTab('statistics')">Statistics</button>
            </div>

            <div id="add-plant" class="tab-content active">
                <h2>🌿 Add New Plant Entry</h2>
                <form id="plantForm" class="form-grid">
                    <div class="form-group">
                        <label for="plantName">Plant Name *</label>
                        <input type="text" id="plantName" required>
                    </div>
                    <div class="form-group">
                        <label for="orderSite">Order Site</label>
                        <input type="text" id="orderSite" placeholder="e.g., Amazon, Local Nursery">
                    </div>
                    <div class="form-group">
                        <label for="box">Box/Location</label>
                        <input type="text" id="box" placeholder="e.g., Garden Box A">
                    </div>
                    <div class="form-group">
                        <label for="dateOrdered">Date Ordered</label>
                        <input type="date" id="dateOrdered">
                    </div>
                    <div class="form-group">
                        <label for="datePlanted">Date Planted</label>
                        <input type="date" id="datePlanted">
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input type="number" id="quantity" min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label for="cost">Cost ($)</label>
                        <input type="number" id="cost" step="0.01" min="0">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="notes">Notes</label>
                        <textarea id="notes" rows="3" placeholder="Care instructions, observations, etc."></textarea>
                    </div>
                </form>
                <button type="submit" class="btn" onclick="addPlant()">Add Plant Entry</button>
                <div id="addPlantMessage"></div>
            </div>

            <div id="view-plants" class="tab-content">
                <h2>🌺 Plant Database</h2>
                <input type="text" class="search-box" id="searchPlants" placeholder="Search plants..." onkeyup="filterPlants()">
                <div id="plantsList" class="plant-list"></div>
            </div>

            <div id="statistics" class="tab-content">
                <h2>📊 Plant Statistics</h2>
                <div class="stats-grid" id="statsGrid"></div>
                <button class="btn btn-secondary" onclick="generateStatistics()">Refresh Statistics</button>
            </div>
        </div>
    </div>

    <script>
        let plants = JSON.parse(localStorage.getItem('plants') || '[]');

        function showTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            if (tabName === 'view-plants') displayPlants();
            if (tabName === 'statistics') generateStatistics();
        }

        function addPlant() {
            const plant = {
                id: Date.now(),
                name: document.getElementById('plantName').value,
                orderSite: document.getElementById('orderSite').value,
                box: document.getElementById('box').value,
                dateOrdered: document.getElementById('dateOrdered').value,
                datePlanted: document.getElementById('datePlanted').value,
                quantity: parseInt(document.getElementById('quantity').value) || 1,
                cost: parseFloat(document.getElementById('cost').value) || 0,
                notes: document.getElementById('notes').value,
                timestamp: new Date().toISOString()
            };

            if (!plant.name) {
                showMessage('Please enter a plant name', 'error', 'addPlantMessage');
                return;
            }

            plants.push(plant);
            localStorage.setItem('plants', JSON.stringify(plants));
            
            showMessage(`Plant "${plant.name}" added successfully!`, 'success', 'addPlantMessage');
            document.getElementById('plantForm').reset();
        }

        function displayPlants() {
            const plantsList = document.getElementById('plantsList');
            if (plants.length === 0) {
                plantsList.innerHTML = '<p style="color: white; text-align: center;">No plants added yet.</p>';
                return;
            }

            plantsList.innerHTML = plants.map(plant => `
                <div class="plant-card" data-name="${plant.name.toLowerCase()}">
                    <h3>${plant.name}</h3>
                    <div class="plant-info">
                        ${plant.orderSite ? `<strong>Order Site:</strong> ${plant.orderSite}<br>` : ''}
                        ${plant.box ? `<strong>Location:</strong> ${plant.box}<br>` : ''}
                        ${plant.dateOrdered ? `<strong>Date Ordered:</strong> ${formatDate(plant.dateOrdered)}<br>` : ''}
                        ${plant.datePlanted ? `<strong>Date Planted:</strong> ${formatDate(plant.datePlanted)}<br>` : ''}
                        <strong>Quantity:</strong> ${plant.quantity}<br>
                        <strong>Cost:</strong> $${plant.cost.toFixed(2)}<br>
                        ${plant.notes ? `<strong>Notes:</strong> ${plant.notes}<br>` : ''}
                        <strong>Added:</strong> ${formatDate(plant.timestamp)}
                    </div>
                    <button class="btn" style="background: #f44336; margin-top: 10px;" onclick="deletePlant(${plant.id})">Delete</button>
                </div>
            `).join('');
        }

        function filterPlants() {
            const searchTerm = document.getElementById('searchPlants').value.toLowerCase();
            const plantCards = document.querySelectorAll('.plant-card');
            
            plantCards.forEach(card => {
                const name = card.dataset.name;
                card.style.display = name.includes(searchTerm) ? 'block' : 'none';
            });
        }

        function deletePlant(id) {
            if (confirm('Are you sure you want to delete this plant?')) {
                plants = plants.filter(plant => plant.id !== id);
                localStorage.setItem('plants', JSON.stringify(plants));
                displayPlants();
                showMessage('Plant deleted successfully!', 'success', 'addPlantMessage');
            }
        }

        function generateStatistics() {
            const statsGrid = document.getElementById('statsGrid');
            
            if (plants.length === 0) {
                statsGrid.innerHTML = '<p style="color: white;">No plant data available for statistics.</p>';
                return;
            }

            const totalPlants = plants.length;
            const totalCost = plants.reduce((sum, plant) => sum + plant.cost, 0);
            const avgCost = totalCost / totalPlants;
            
            const orderSites = {};
            const monthlyPlanting = {};
            
            plants.forEach(plant => {
                // Count order sites
                if (plant.orderSite) {
                    orderSites[plant.orderSite] = (orderSites[plant.orderSite] || 0) + 1;
                }
                
                // Count monthly planting
                if (plant.datePlanted) {
                    const month = plant.datePlanted.substring(0, 7);
                    monthlyPlanting[month] = (monthlyPlanting[month] || 0) + 1;
                }
            });

            const topSite = Object.entries(orderSites).sort((a, b) => b[1] - a[1])[0];
            const recentMonth = Object.entries(monthlyPlanting).sort().pop();

            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalPlants}</div>
                    <div class="stat-label">Total Plants</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">$${totalCost.toFixed(2)}</div>
                    <div class="stat-label">Total Investment</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">$${avgCost.toFixed(2)}</div>
                    <div class="stat-label">Average Cost</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${topSite ? topSite[0] : 'N/A'}</div>
                    <div class="stat-label">Top Order Site</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${recentMonth ? recentMonth[1] : 0}</div>
                    <div class="stat-label">Plants This Month</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${Object.keys(orderSites).length}</div>
                    <div class="stat-label">Order Sources</div>
                </div>
            `;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString();
        }

        function showMessage(message, type, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => container.innerHTML = '', 5000);
        }

        // Initialize
        displayPlants();
        generateStatistics();
    </script>
</body>
</html>
